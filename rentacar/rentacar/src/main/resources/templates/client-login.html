<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Autentificare client | RentFlow</title>

    <link rel="stylesheet"
      href="/css/premium-final.css?v=20261012-auth">
</head>

<body>
<header th:replace="~{fragments/premium :: navigation('customers')}"></header>

<main class="app-main">
    <div class="app-container">
        <section class="panel client-auth-panel client-auth-login">

            <p class="eyebrow">AUTENTIFICARE CLIENT</p>

            <h1>Bine ai revenit.</h1>

            <p class="subtitle">
                Introdu emailul și parola contului tău.
            </p>

            <div class="alert alert-success"
                 role="status"
                 th:if="${success}"
                 th:text="${success}">
            </div>

            <div class="alert alert-error"
                 role="alert"
                 th:if="${param.error}">
                Emailul sau parola sunt incorecte.
            </div>

            <div class="alert"
                 role="status"
                 th:if="${loggedIn}">
                Ai deja o sesiune activă.
                <a th:href="@{/client/account}">Deschide contul meu</a>
                sau autentifică-te cu alt cont.
            </div>

            <form th:action="@{/client/login}" method="post">

                <div class="client-auth-fields">
                    <div class="form-field">
                        <label for="email">Email</label>

                        <input id="email"
                               name="email"
                               type="email"
                               placeholder="Ex.: client@example.com"
                               maxlength="254"
                               autocomplete="username"
                               required>
                    </div>

                    <div class="form-field">
                        <label for="password">Parolă</label>

                        <input id="password"
                               name="password"
                               type="password"
                               placeholder="Introdu parola"
                               maxlength="72"
                               autocomplete="current-password"
                               required>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="button" type="submit">
                        Autentifică-te
                    </button>

                    <a class="button button-secondary"
                       th:href="@{/customers}">
                        Înapoi la clienți
                    </a>
                </div>

            </form>

            <p class="client-auth-note">
                Nu ai un cont?
                <a th:href="@{/client/register}">Creează un cont</a>.
            </p>

        </section>
    </div>
</main>
</body>
</html>
